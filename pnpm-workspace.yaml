packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@anywidget/types": ^0.4.0
  "@types/node": ^22.20.2
  es-module-lexer: ^2.3.2
  jsdom: 29.1.1
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
  vitepress: ^1.6.4
  vue: ^3.5.42

minimumReleaseAge: 2880
minimumReleaseAgeStrict: true

# Explicitly requested Vite+ release, including its matching native packages.
minimumReleaseAgeExclude:
  - "vite-plus@0.3.2"
  - "@voidzero-dev/vite-plus-core@0.3.2"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.3.2"
  - "@voidzero-dev/vite-plus-darwin-x64@0.3.2"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.2"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.3.2"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.3.2"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.3.2"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.2"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.3.2"

overrides:
  vite: "catalog:"
  vitepress>vite: ^5.4.0

# Vite+ supplies the tested Vite implementation under its own version number.
peerDependencyRules:
  allowedVersions:
    "vitest@4.1.11>vite": "0.3.2"
    "@vitest/mocker@4.1.11>vite": "0.3.2"

allowBuilds:
  esbuild: true
