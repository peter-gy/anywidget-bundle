[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anywidget-bundle"
version = "0.0.1"
description = "Load Vite-built anywidget modules from Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
maintainers = [{ name = "Peter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.11"
keywords = ["anywidget", "jupyter", "marimo", "vite", "widgets"]
dependencies = ["anywidget>=0.11.0"]
classifiers = [
  "Framework :: Jupyter",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://peter-gy.github.io/anywidget-bundle/"
Issues = "https://github.com/peter-gy/anywidget-bundle/issues"
Source = "https://github.com/peter-gy/anywidget-bundle"

[project.optional-dependencies]
build = ["hatchling>=1.31"]

[project.entry-points.hatch]
anywidget-bundle = "anywidget_bundle._hatch"

[tool.hatch.build]
only-packages = true

[tool.hatch.build.targets.wheel]
packages = ["src/anywidget_bundle"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/src/anywidget_bundle"]
