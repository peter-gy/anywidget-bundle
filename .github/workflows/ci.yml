name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: true

      - name: Install Python workspace
        run: uv sync --frozen

      - name: Verify workspace
        run: make check test build

      - name: Pack npm package
        run: pnpm --filter anywidget-bundle pack --pack-destination dist/npm

      - name: Upload npm package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: node-compatibility-package
          path: dist/npm/anywidget-bundle-*.tgz
          retention-days: 1
          if-no-files-found: error

  node-compatibility:
    name: Node.js 20 compatibility
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20.19.0
          package-manager-cache: false

      - name: Download npm package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: node-compatibility-package
          path: dist/npm

      - name: Verify npm package
        shell: bash
        run: |
          npm_dir="$RUNNER_TEMP/anywidget-bundle-node-20"
          tarball="$(find dist/npm -name 'anywidget-bundle-*.tgz' -print -quit)"
          npm install --prefix "$npm_dir" --ignore-scripts --no-audit --no-fund "$tarball" vite@8
          cp packages/vite/tests/compatibility.mjs "$npm_dir/compatibility.mjs"
          cd "$npm_dir"
          node compatibility.mjs

  python-compatibility:
    name: Python 3.14 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install Python workspace
        run: uv sync --frozen --python 3.14

      - name: Verify Python package
        run: uv run --python 3.14 pytest
