name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: true

      - name: Install Python workspace
        run: uv sync --frozen

      - name: Install browser
        run: pnpm --filter @anywidget-bundle/e2e exec playwright install --with-deps chromium

      - name: Verify workspace
        env:
          BASE_PATH: /anywidget-bundle
        run: make check test build

      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bundle-browser-results
          path: |
            dist/e2e/results
            dist/e2e/report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Pack npm package
        run: pnpm --filter anywidget-bundle pack --pack-destination dist/npm

      - name: Upload npm package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: node-compatibility-package
          path: dist/npm/anywidget-bundle-*.tgz
          retention-days: 1
          if-no-files-found: error

  node-compatibility:
    name: Node.js ${{ matrix.node-version }} compatibility
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19.0", "22", "24", "26"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Download npm package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: node-compatibility-package
          path: dist/npm

      - name: Verify npm package
        shell: bash
        run: |
          npm_dir="$RUNNER_TEMP/anywidget-bundle"
          tarball="$(find dist/npm -name 'anywidget-bundle-*.tgz' -print -quit)"
          npm install --prefix "$npm_dir" --ignore-scripts --no-audit --no-fund "$tarball" vite@8
          cp packages/vite/tests/compatibility.mjs "$npm_dir/compatibility.mjs"
          cd "$npm_dir"
          node compatibility.mjs

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Python workspace
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Verify Python package
        run: uv run --frozen --python ${{ matrix.python-version }} pytest
