[tool.uv]
required-version = ">=0.12.14"
exclude-newer = "2 days"

[tool.uv.workspace]
members = ["packages/widget"]

[dependency-groups]
dev = [
  "hatchling==1.31.0",
  "jupyterlab==4.6.2",
  "pyrefly>=1",
  "pytest>=9.0.3",
  "ruff>=0.15.14",
  "ty>=0.0.39",
]

[tool.pyrefly]
project-includes = ["packages/widget/src", "packages/widget/tests"]
search-path = ["packages/widget/src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["packages/widget/tests"]

[tool.ruff]
line-length = 100
src = ["packages/widget/src", "packages/widget/tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
